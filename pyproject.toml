[project]
name = "wiiuport-tools"
version = "0.1.0"
description = "Maintainer tooling for the wiiuport Wii U runtime"
requires-python = ">=3.12"
dependencies = [
    "evdev",
]

[dependency-groups]
dev = [
    "libclang",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
